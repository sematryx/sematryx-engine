[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sematryx-engine"
version = "0.1.0"
description = "Local-first Sematryx optimization engine"
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "Sematryx", email = "support@sematryx.com" }
]
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=1.24.0",
  "scipy>=1.10.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
  "mypy>=1.10.0",
  "pre-commit>=3.7.0",
]

[project.scripts]
sematryx-engine = "sematryx_engine.cli:main"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/README.md",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sematryx_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["scipy", "scipy.*"]
ignore_missing_imports = true
